<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Core: a glass app-icon ring with its inner square turned 45° (palette from tokens.ts). -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F2"/>
      <stop offset="0.45" stop-color="#7FF5E1"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0E12"/>
  <rect x="11" y="11" width="42" height="42" rx="12" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <rect x="25" y="25" width="14" height="14" rx="3.5" fill="none" stroke="url(#ring)" stroke-width="3" transform="rotate(45 32 32)"/>
</svg>
